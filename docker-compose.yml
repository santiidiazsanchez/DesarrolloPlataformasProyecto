name: ${COMPOSE_PROJECT_NAME:-incidentes-unidad8}
# PostgreSQL 17, la misma versión que la base de Render y la de GitHub Actions.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: incidentes_db
      POSTGRES_USER: incidentes_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta npm run configurar}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "incidentes_app", "-d", "incidentes_db"]
      interval: 5s
      timeout: 5s
      retries: 30
  postgres-test:
    image: postgres:17
    profiles: [pruebas]
    environment:
      POSTGRES_DB: incidentes_test
      POSTGRES_USER: incidentes_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta npm run configurar}
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "incidentes_app", "-d", "incidentes_test"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
