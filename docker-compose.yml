name: ${COMPOSE_PROJECT_NAME:-incidentes-unidad5}
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecuta npm run configurar}
      MYSQL_DATABASE: incidentes_db
      MYSQL_USER: incidentes_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ejecuta npm run configurar}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
  mysql-test:
    image: mysql:8.4
    profiles: [pruebas]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecuta npm run configurar}
      MYSQL_DATABASE: incidentes_test
      MYSQL_USER: incidentes_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ejecuta npm run configurar}
    ports:
      - "127.0.0.1:3308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
