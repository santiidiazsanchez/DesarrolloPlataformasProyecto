<text class="n" x="550.0" y="510">Antes: el controlador validaba filtros y paginación y repetía 3 veces la conversión del código INC;</text>
<text class="n" x="550.0" y="532">la traducción de "En revisión" estaba en 4 lugares. Ahora cada capa tiene una sola responsabilidad.</text>
